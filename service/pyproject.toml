[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-service"
version = "0.1.0"
description = "Optional REST sidecar for QuantX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "quantx-core",
    "quantx-crypto-adapters",
    "quantx-combiners",
    "quantx-registry",
    "quantx-session",
]

[project.scripts]
quantx = "quantx_service.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]
