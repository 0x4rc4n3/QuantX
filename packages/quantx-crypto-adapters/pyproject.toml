[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-crypto-adapters"
version = "0.1.0"
description = "Layer 1 classical and post-quantum algorithm adapters for QuantX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "quantx-core>=0.1.0",
    "cryptography>=48,<51",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
