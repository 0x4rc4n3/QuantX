[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-session"
version = "0.1.0"
description = "QuantX session orchestration, challenge issuance, and token minting (Layer 4)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "QuantX Team" }]
license = { text = "Apache-2.0" }
dependencies = [
    "quantx-core>=0.1.0",
    "quantx-combiners>=0.1.0",
    "quantx-registry>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "quantx-crypto-adapters>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
