[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-authenticator"
version = "0.1.0"
description = "Layer 5 second-factor authentication (TOTP, HOTP, Push) for QuantX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "quantx-core",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
    "quantx-session",
]

[tool.setuptools.packages.find]
where = ["src"]
